# Checks the Library Manager tasks on every push: each solution must pass the shared checker
# (tasks/check/check.py) on Linux and on Windows, and the repository's tests must pass.

# name: the workflow's name on the Actions tab.
name: Tasks

# on: the events that start the workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

# jobs: the work to do. Each job runs on a fresh machine.
jobs:
  check:
    # strategy.matrix: run the same job once per operating system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # runs-on: the kind of machine GitHub starts for the job.
    runs-on: ${{ matrix.os }}
    # defaults.run.shell: bash on both systems, so one script works everywhere.
    defaults:
      run:
        shell: bash
    # steps: run in order. "uses" runs a published action, "run" runs shell commands.
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          # cache: keep downloaded Maven packages between runs.
          cache: maven

      - name: Set up Python (for the checker)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile everything
        run: mvn -B -q compile

      - name: Check every task solution
        run: |
          fail=0
          for dir in tasks/[0-9][0-9]_*/ tasks/B_*/; do
            name=$(basename "$dir"); id=${name%%_*}; task="-Dtask=$name/solution"
            case $id in
              08|09|10) python tasks/check/check.py "$id" -- mvn -q compile exec:java@task "$task" "-Dexec.args=tasks/data" ;;
              11) python tasks/check/check.py 11 -- mvn -q compile exec:java@tests "$task" ;;
              12) python tasks/check/check.py 12 -- mvn -q compile exec:java@task "$task" "-Dexec.args=tasks/data {port}" &&
                  python tasks/check/check.py 12_stretch -- mvn -q compile exec:java@task "$task" "-Dexec.args=--summarise tasks/data/openlibrary_dune.json" ;;
              *) python tasks/check/check.py "$id" -- mvn -q compile exec:java@task "$task" ;;
            esac || fail=1
          done
          exit $fail

      - name: Run the tests
        run: mvn -B test
